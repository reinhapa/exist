/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = uri('https://maven.pkg.github.com/eXist-db/exist')
    }

    maven {
        url = uri('https://repo.exist-db.org/repository/exist-db-snapshots/')
    }

    maven {
        url = uri('https://repo.exist-db.org/repository/exist-db/')
    }

    maven {
        url = uri('https://repo.exist-db.org/repository/maven-central/')
    }

    maven {
        url = uri('https://repo.evolvedbinary.com/repository/exist-db-snapshots/')
    }

    maven {
        url = uri('https://repo.evolvedbinary.com/repository/exist-db/')
    }

    maven {
        url = uri('https://repo.osgeo.org/repository/geotools-releases/')
    }

    maven {
        url = uri('https://packages.atlassian.com/maven-3rdparty/')
    }

    maven {
        url = uri('https://maven.indexdata.com')
    }
}

group = 'org.exist-db'
version = '7.0.0-SNAPSHOT'
java.sourceCompatibility = JavaVersion.VERSION_21

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile) {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc) {
    options.encoding = 'UTF-8'
}
