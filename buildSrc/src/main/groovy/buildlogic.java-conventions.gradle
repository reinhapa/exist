/*
 * This file was generated by the Gradle 'init' task.
 */

plugins {
    id 'java-library'
    id 'maven-publish'
}

configurations {
    configureEach {
        resolutionStrategy {
            cacheChangingModulesFor(0, 'seconds')
            cacheDynamicVersionsFor(0, 'seconds')
        }
        exclude group: 'xml-apis', module: 'xml-apis'
    }
}

repositories {
    mavenLocal()
    mavenCentral()

    maven {
        url = uri('https://maven.pkg.github.com/eXist-db/exist')
        credentials {
            username = project.findProperty("gpr.user") ?: System.getenv("GITHUB_USERNAME")
            password = project.findProperty("gpr.key") ?: System.getenv("GITHUB_TOKEN")
        }
    }

    maven { url = uri('https://repo.exist-db.org/repository/exist-db/') }
    maven { url = uri('https://repo.osgeo.org/repository/geotools-releases/') }
    maven { url = uri('https://packages.atlassian.com/maven-3rdparty/') }
    maven { url = uri('https://maven.indexdata.com') }
    maven { url = uri('https://repo.spring.io/milestone/') }

/*
    maven { url = uri('https://repo.exist-db.org/repository/maven-central/') }
    maven { url = uri('https://repo.exist-db.org/repository/exist-db-snapshots/') }
    maven { url = uri('https://repo.evolvedbinary.com/repository/exist-db-snapshots/') }
    maven { url = uri('https://repo.evolvedbinary.com/repository/exist-db/') }
*/
}

group = 'org.exist-db'
version = '7.0.0-SNAPSHOT'

java {
    sourceCompatibility = JavaVersion.VERSION_21
}

publishing {
    publications {
        maven(MavenPublication) {
            from(components.java)
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Javadoc).configureEach {
    options.encoding = 'UTF-8'
}

tasks.withType(Test).configureEach {
    systemProperty 'exist.configurationFile', project.layout.buildDirectory.file('resources/test/conf.xml').get().asFile.toString()
    systemProperty 'exist.jetty.standalone.webapp.dir', project.layout.buildDirectory.dir('esources/test/standalone-webapp').get().asFile.toString()
    systemProperty 'exist.recovery.progressbar.hide', 'true'
    systemProperty 'file.encoding', 'UTF-8'
    systemProperty 'jetty.home', rootProject.layout.projectDirectory.dir('exist-jetty-config/target/classes/org/exist/jetty').asFile.toString()
    systemProperty 'log4j.configurationFile', project.layout.buildDirectory.file('resources/test/log4j2.xml').get().asFile.toString()
}

tasks.processTestResources {
    duplicatesStrategy = DuplicatesStrategy.WARN
    // Specify the directory for filtered resources
    def buildSourceDir = project.layout.buildDirectory.dir('resources/test').get().asFile.toString()
    from ("src/test/resources-filtered") {
        filter {
            line -> line.replaceAll(/\$\{basedir\}\/target\/test-data/, buildSourceDir)
        }
    }
    // Include default test resources additionally
    from ("src/test/resources") {
        include '**/*'
    }
}
