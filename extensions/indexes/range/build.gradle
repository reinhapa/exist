plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api project(':exist-index-lucene')
    api libs.org.apache.logging.log4j.log4j.api
    api libs.org.apache.lucene.lucene.core
    api libs.org.apache.lucene.lucene.analysis.common
    api libs.org.apache.lucene.lucene.analysis.icu
    api libs.com.ibm.icu.icu4j
    api libs.org.apache.lucene.lucene.facet
    api libs.com.google.code.findbugs.jsr305
    testImplementation libs.junit.junit
    testImplementation libs.org.easymock.easymock
    testImplementation libs.ch.qos.logback.logback.core
    testImplementation libs.io.github.hakky54.logcaptor
}

description = 'eXist-db Lucene Range Index'
