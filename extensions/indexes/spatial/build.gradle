plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.org.apache.logging.log4j.log4j.api
    api libs.org.geotools.gt.api
    api libs.org.geotools.gt.main
    api libs.org.geotools.gt.referencing
    api libs.org.geotools.gt.xml
    api libs.org.hsqldb.hsqldb
    api libs.org.locationtech.jts.jts.core
    api libs.commons.io.commons.io
    runtimeOnly libs.org.jdom.jdom
    runtimeOnly libs.org.geotools.gt.epsg.wkt
    runtimeOnly libs.java3d.vecmath
    runtimeOnly libs.javax.media.jai.core
    testImplementation libs.junit.junit
}

description = 'eXist-db Spatial Index'
