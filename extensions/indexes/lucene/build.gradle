plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.org.apache.commons.commons.collections4
    api libs.org.apache.logging.log4j.log4j.api
    api libs.org.apache.lucene.lucene.core
    api libs.org.apache.lucene.lucene.analyzers.common
    api libs.org.apache.lucene.lucene.analyzers.icu
    api libs.org.apache.lucene.lucene.facet
    api libs.org.apache.lucene.lucene.queryparser
    api libs.com.evolvedbinary.j8fu.j8fu
    api libs.io.lacuna.bifurcan
    api libs.it.unimi.dsi.fastutil
    api libs.net.sf.xmldb.org.xmldb.api
    api libs.com.google.code.findbugs.jsr305
    runtimeOnly libs.org.apache.lucene.lucene.queries
    testImplementation libs.junit.junit
    testImplementation libs.org.xmlunit.xmlunit.legacy
    testImplementation libs.com.googlecode.junit.toolbox.junit.toolbox
    testImplementation project(':exist-samples')
}

description = 'eXist-db Lucene Index'
