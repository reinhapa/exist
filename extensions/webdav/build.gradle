plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.commons.beanutils.commons.beanutils
    api libs.org.exist.db.thirdparty.com.ettrema.milton.api
    api libs.org.exist.db.thirdparty.com.ettrema.milton.servlet
    api libs.commons.io.commons.io
    api libs.org.apache.logging.log4j.log4j.api
    runtimeOnly libs.org.jdom.jdom
    testImplementation libs.junit.junit
    testImplementation libs.org.exist.db.thirdparty.com.ettrema.milton.client
    testImplementation libs.com.google.code.findbugs.jsr305
    testImplementation libs.org.apache.httpcomponents.httpclient
    testImplementation libs.org.apache.httpcomponents.httpcore
    testImplementation libs.org.eclipse.jetty.jetty.deploy
    testImplementation libs.org.eclipse.jetty.jetty.jmx
    testImplementation project(':exist-jetty-config')
    compileOnly libs.jakarta.servlet.jakarta.servlet.api
}

description = 'eXist-db WebDAV Extension'
