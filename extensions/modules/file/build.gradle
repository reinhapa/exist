plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.org.apache.logging.log4j.log4j.api
    api libs.com.evolvedbinary.multilock.multilock
    api libs.net.sf.xmldb.org.xmldb.api
    api libs.org.apache.ant.ant
    runtimeOnly libs.org.eclipse.angus.angus.activation
    testImplementation libs.com.evolvedbinary.j8fu.j8fu
    testImplementation libs.commons.io.commons.io
    testImplementation libs.jakarta.xml.bind.jakarta.xml.bind.api
    testImplementation libs.org.eclipse.jetty.jetty.deploy
    testImplementation libs.org.eclipse.jetty.jetty.jmx
    testImplementation libs.junit.junit
    testImplementation project(':exist-jetty-config')
    testImplementation testFixtures(project(':exist-core'))
    testImplementation libs.org.apache.httpcomponents.httpcore
    testImplementation libs.org.apache.httpcomponents.fluent.hc
    testImplementation libs.commons.codec.commons.codec
}

description = 'eXist-db File Module'
