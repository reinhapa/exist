plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.com.google.code.findbugs.jsr305
    api libs.jakarta.activation.jakarta.activation.api
    api libs.jakarta.mail.jakarta.mail.api
    api libs.commons.codec.commons.codec
    api libs.org.apache.logging.log4j.log4j.api
    runtimeOnly libs.org.eclipse.angus.angus.activation
    runtimeOnly libs.org.eclipse.angus.angus.mail
    testImplementation libs.junit.junit
    testImplementation libs.com.evolvedbinary.j8fu.j8fu
    testImplementation libs.com.icegreen.greenmail.junit4
    testImplementation libs.com.icegreen.greenmail
}

description = 'eXist-db Email Module'
