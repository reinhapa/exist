plugins {
    id 'buildlogic.java-conventions'
}

dependencies {
    api project(':exist-core')
    api libs.org.apache.logging.log4j.log4j.api
    api libs.org.apache.tika.tika.core
    api libs.com.google.code.findbugs.jsr305
    runtimeOnly libs.org.apache.tika.tika.parsers.standard.package
    testImplementation libs.org.junit.vintage.junit.vintage.engine
    testImplementation libs.junit.junit
    testImplementation libs.com.evolvedbinary.j8fu.j8fu
}

description = 'eXist-db Content Extraction Extension'
